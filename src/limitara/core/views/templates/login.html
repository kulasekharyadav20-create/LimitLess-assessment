{% extends "base.html" %}{% block body %}
<h1>Sign in</h1><p>Sign-in is a stand-in for the demo: choose who you are. What you may see and do is enforced on the server.</p>
<form method="post" action="/login"><select name="user_id">
{% for u in users %}<option value="{{ u.id }}">{{ u.name }} &mdash; {{ u.role }}</option>{% endfor %}</select> <button>Sign in</button></form>
{% endblock %}
