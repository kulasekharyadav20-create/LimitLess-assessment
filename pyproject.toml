[project]
name = "limitara"
version = "0.1.0"
description = "Quote-to-dispatch system where every promise is one the factory can keep"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
start = "limitara.launcher:main"
seed = "limitara.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limitara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
